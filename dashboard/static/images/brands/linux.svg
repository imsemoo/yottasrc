<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Linux">
  <defs>
    <linearGradient id="tux-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4f92d6"/>
      <stop offset="100%" stop-color="#2c6fbb"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="32" fill="url(#tux-bg)"/>
  <!-- Simplified Tux silhouette (body + head + feet + beak) -->
  <g>
    <!-- Body (white belly + black back) -->
    <ellipse cx="32" cy="40" rx="14" ry="15" fill="#111827"/>
    <ellipse cx="32" cy="43" rx="9"  ry="11" fill="#f9fafb"/>
    <!-- Head -->
    <ellipse cx="32" cy="23" rx="11" ry="11" fill="#111827"/>
    <!-- Eyes (white ovals + black pupils) -->
    <ellipse cx="28" cy="22" rx="2.6" ry="3.6" fill="#fff"/>
    <ellipse cx="36" cy="22" rx="2.6" ry="3.6" fill="#fff"/>
    <circle  cx="28.8" cy="23" r="1.3" fill="#111827"/>
    <circle  cx="35.2" cy="23" r="1.3" fill="#111827"/>
    <!-- Beak -->
    <path d="M29 26 Q32 30 35 26 L34 28.5 L32 29.5 L30 28.5 Z" fill="#f59e0b"/>
    <!-- Feet -->
    <ellipse cx="26" cy="54" rx="4" ry="2" fill="#f59e0b"/>
    <ellipse cx="38" cy="54" rx="4" ry="2" fill="#f59e0b"/>
  </g>
</svg>
