<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Microsoft Windows">
  <!-- Dark navy background — like the reference screenshot -->
  <rect width="64" height="64" rx="14" fill="#0f172a"/>
  <!-- 4-color Microsoft tiles (red / green / blue / yellow) -->
  <g transform="translate(14 14)">
    <rect x="0"  y="0"  width="16" height="16" rx="2" fill="#f24e1e"/>
    <rect x="20" y="0"  width="16" height="16" rx="2" fill="#7fba00"/>
    <rect x="0"  y="20" width="16" height="16" rx="2" fill="#00a4ef"/>
    <rect x="20" y="20" width="16" height="16" rx="2" fill="#ffb900"/>
  </g>
</svg>
